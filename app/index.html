<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentDump — 転職エージェント業務管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@500&family=Zen+Kaku+Gothic+New:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
    <p>AgentDump を読み込み中...</p>
  </div>

  <div id="app-root" class="app-root hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">📋</span>
        <div>
          <strong>AgentDump</strong>
          <small>転職エージェント向け</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-page="dashboard">ダッシュボード</button>
        <button type="button" class="nav-item" data-page="companies">🏢 採用企業</button>
        <button type="button" class="nav-item" data-page="job-seekers">👤 転職者</button>
        <button type="button" class="nav-item" data-page="tasks">✅ タスク</button>
        <button type="button" class="nav-item" data-page="insights">💡 気づき</button>
        <button type="button" class="nav-item" data-page="settings">⚙️ 設定</button>
      </nav>
      <div class="sidebar-footer">
        <div id="user-info" class="user-info"></div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <h1 id="page-title">ダッシュボード</h1>
        <div id="header-org" class="header-org"></div>
      </header>
      <div id="page-content" class="page-content"></div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button type="button" class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
